[package]
name = "siem"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
nom = "7.1"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
flate2 = "1.0"
compact_str = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "parser_bench"
harness = false

[build-dependencies]
cc = "1.0"
